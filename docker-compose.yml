# =============================================================================
# AutoDiscovery — Local Development Infrastructure
# =============================================================================
# Starts node + indexer for a local Midnight network.
# NOTE: proof-server is expected to already be running on :6300 separately.
#       If not, uncomment the proof-server service below.
#
# Usage:
#   docker compose up -d       # start in background
#   docker compose down        # stop and remove containers
#
# After all services are healthy, run:
#   npm run deploy:local       # (from autodiscovery-contract/) deploy all contracts
# =============================================================================

services:
  node:
    image: 'midnightntwrk/midnight-node:0.22.3'
    container_name: 'ad-node'
    ports:
      - "9944:9944"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      CFG_PRESET: "dev"

  indexer:
    container_name: 'ad-indexer'
    image: 'midnightntwrk/indexer-standalone:4.0.1'
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_started

