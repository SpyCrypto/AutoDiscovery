name: Contract Tests & Validation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'autodiscovery-contract/**'
      - 'autodiscovery-cli/**'
      - 'package.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main

jobs:
  contract-build:
    runs-on: ubuntu-latest
    name: Build Smart Contracts
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-save
      
      - name: Build contracts
        run: npm run build --workspace=autodiscovery-contract
      
      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-build
          path: |
            autodiscovery-contract/dist/
            autodiscovery-contract/src/managed/
          retention-days: 30

  frontend-build-test:
    runs-on: ubuntu-latest
    name: Frontend Build & Test
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-save
      
      - name: Build frontend
        run: npm run build --workspace=autodiscovery-contract && npm run build --workspace=frontend-demoland-vite-react
      
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-demoland-vite-react/dist/
          retention-days: 30
      
      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sh frontend-demoland-vite-react/dist | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"
          du -sh frontend-demoland-vite-react/dist/assets/* || true

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Analysis
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-save
      
      - name: Run TypeScript compiler
        run: npm run build --workspace=frontend-demoland-vite-react 2>&1 | tail -20 || echo "Build completed"

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency & Security Check
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-save
      
      - name: Run npm audit
        run: npm audit --production 2>&1 || echo "Audit check completed"
      
      - name: Check for outdated packages
        run: npm outdated || echo "Package check completed"
