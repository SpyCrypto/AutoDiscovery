services:
  # Frontend Demoland - React application with nginx (v6.4.1 + React 19 + Tailwind 4)
  frontend:
    image: autodiscovery-preview:latest
    container_name: autodiscovery-preview
    ports:
      - "80:80"
      - "443:443"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - autodiscovery
    labels:
      com.example.description: "AutoDiscovery Preview Frontend"
      version: "0.1.0"
      vite: "6.4.1"
      react: "19.1.0"
      tailwind: "4.1.10"
      nginx: "1.27-alpine"

  # Redis 7-alpine for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: autodiscovery-preview-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - autodiscovery
    command: redis-server --appendonly yes

volumes:
  redis_data:

networks:
  autodiscovery:
    driver: bridge
