version: '3.8'

# Simplified local development stack
# Uses mock services since Midnight image isn't available

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: autodiscovery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL for off-chain data (optional)
  postgres:
    image: postgres:16-alpine
    container_name: autodiscovery-postgres
    environment:
      POSTGRES_DB: autodiscovery
      POSTGRES_USER: autodiscovery
      POSTGRES_PASSWORD: autodiscovery_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodiscovery"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

networks:
  default:
    name: autodiscovery-local
    driver: bridge
